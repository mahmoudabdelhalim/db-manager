<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <circle cx="200" cy="200" r="200" fill="#6366f1" opacity="0.07" filter="url(#blur)"/>
  <circle cx="1000" cy="200" r="220" fill="#3b82f6" opacity="0.07" filter="url(#blur)"/>
  <circle cx="600" cy="350" r="180" fill="#8b5cf6" opacity="0.05" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Left decorative DB cylinder -->
  <g transform="translate(108, 165)">
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <rect x="-44" y="0" width="88" height="52" fill="#1e1b4b" opacity="0.9"/>
    <ellipse cx="0" cy="52" rx="44" ry="14" fill="#312e81" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="-44" y1="0" x2="-44" y2="52" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="0" x2="44" y2="52" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">DB</text>
  </g>

  <!-- Right decorative DB cylinder (smaller) -->
  <g transform="translate(1092, 175)">
    <ellipse cx="0" cy="0" rx="34" ry="11" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <rect x="-34" y="0" width="68" height="40" fill="#1e1b4b" opacity="0.9"/>
    <ellipse cx="0" cy="40" rx="34" ry="11" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="34" ry="11" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="-34" y1="0" x2="-34" y2="40" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="34" y1="0" x2="34" y2="40" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="9" font-weight="bold">DB</text>
  </g>

  <!-- Central card / terminal window -->
  <rect x="370" y="80" width="460" height="240" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.95"/>
  <!-- window controls -->
  <circle cx="398" cy="104" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="420" cy="104" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="442" cy="104" r="6" fill="#10b981" opacity="0.8"/>
  <!-- title bar text -->
  <text x="600" y="108" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">db-manager ~ SQL</text>
  <!-- divider -->
  <line x1="370" y1="118" x2="830" y2="118" stroke="#1e293b" stroke-width="1"/>
  <!-- Code lines -->
  <text x="395" y="143" fill="#475569" font-family="monospace" font-size="12">$</text>
  <text x="410" y="143" fill="#818cf8" font-family="monospace" font-size="12">composer require</text>
  <text x="630" y="143" fill="#34d399" font-family="monospace" font-size="12">mahmoudabdelhalim/db-manager</text>

  <text x="395" y="170" fill="#475569" font-family="monospace" font-size="11">// config/db-manager.php</text>
  <text x="395" y="192" fill="#f472b6" font-family="monospace" font-size="11">'connection_mode'</text>
  <text x="540" y="192" fill="#94a3b8" font-family="monospace" font-size="11">=></text>
  <text x="562" y="192" fill="#fb923c" font-family="monospace" font-size="11">'laravel'</text>
  <text x="619" y="192" fill="#94a3b8" font-family="monospace" font-size="11">,</text>

  <text x="395" y="212" fill="#f472b6" font-family="monospace" font-size="11">'middleware'</text>
  <text x="494" y="212" fill="#94a3b8" font-family="monospace" font-size="11">=></text>
  <text x="516" y="212" fill="#94a3b8" font-family="monospace" font-size="11">[</text>
  <text x="526" y="212" fill="#fb923c" font-family="monospace" font-size="11">'web'</text>
  <text x="564" y="212" fill="#94a3b8" font-family="monospace" font-size="11">,</text>
  <text x="572" y="212" fill="#fb923c" font-family="monospace" font-size="11">'auth'</text>
  <text x="611" y="212" fill="#94a3b8" font-family="monospace" font-size="11">],</text>

  <text x="395" y="232" fill="#f472b6" font-family="monospace" font-size="11">'prefix'</text>
  <text x="453" y="232" fill="#94a3b8" font-family="monospace" font-size="11">=></text>
  <text x="475" y="232" fill="#fb923c" font-family="monospace" font-size="11">'db-manager'</text>
  <text x="575" y="232" fill="#94a3b8" font-family="monospace" font-size="11">,</text>

  <!-- cursor blink -->
  <rect x="395" y="252" width="8" height="14" fill="#6366f1" opacity="0.9" rx="1"/>

  <!-- Gradient overlay on card bottom -->
  <rect x="370" y="270" width="460" height="50" rx="0" fill="url(#glow)"/>
  <rect x="370" y="300" width="460" height="20" rx="0" fill="#0f172a" opacity="0.5"/>
  <rect x="370" y="308" width="460" height="12" rx="0" fill="url(#bg)"/>

  <!-- Package name -->
  <text x="600" y="62" text-anchor="middle" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="6" opacity="0.9">MAHMOUDABDELHALIM</text>

  <!-- Main title -->
  <text x="600" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" filter="url(#shadow)">
    <tspan fill="#f1f5f9">DB</tspan>
    <tspan fill="url(#accent)"> Manager</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="390" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1">A Beautiful Laravel Database Manager Package</text>

  <!-- Accent line bottom -->
  <rect x="0" y="397" width="1200" height="3" fill="url(#accent)"/>
</svg>
